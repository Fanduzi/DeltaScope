# Canonical valid GitHub Actions example for the docs drift checker.
# Kept deliberately small and readable; the real example lives at
# docs/examples/github-actions.yml. Pinned to v0.330.0 (the release that
# introduced --format github-summary) so structural + version checks pass.
name: SQL Audit
on:
  push:
permissions:
  contents: read
jobs:
  audit:
    steps:
      - env:
          DELTASCOPE_VERSION: v0.330.0
        run: |
          deltascope config lint --file deltascope.yaml --strict
          deltascope audit --file migrations.sql --format github-actions
          deltascope audit --file migrations.sql --format github-summary --fail-on none >> "$GITHUB_STEP_SUMMARY"
