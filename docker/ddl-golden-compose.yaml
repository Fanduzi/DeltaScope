# Version pins are normative anchors from milestone issue #79/#81. Do not move to
# floating tags or other patch versions; observed versions and image digests are
# recorded into the golden artifact and verified against these pins.
services:
  mysql57:
    image: mysql@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    container_name: deltascope-ddl-golden-mysql57
    # Loopback-only publish: T04-B (#83) version-identity metadata cases run
    # the freshly built host CLI against this anchor over TCP.
    ports:
      - "127.0.0.1:23357:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golden
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mysql80:
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: deltascope-ddl-golden-mysql80
    ports:
      - "127.0.0.1:23380:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golden
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mysql84:
    image: mysql@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    container_name: deltascope-ddl-golden-mysql84
    ports:
      - "127.0.0.1:23384:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golden
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  tidb85:
    image: pingcap/tidb@sha256:490861bd4a2fa643dbe76b77ffecafcad66e6a42774e580b82f4ec2429a80e57
    container_name: deltascope-ddl-golden-tidb85
    # Loopback publish of the MySQL protocol port so the host CLI can audit
    # against the TiDB compatibility banner directly (T04-B/#83).
    ports:
      - "127.0.0.1:24000:4000"
    command:
      - --store=unistore
      - --path=
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  tidb85-client:
    image: mysql@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    container_name: deltascope-ddl-golden-tidb85-client
    depends_on:
      tidb85:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h tidb85 -P 4000 -uroot -Nse 'SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # --- T04-B-R1 auxiliary fixtures (issue #83) -----------------------------
  # Disposable variants pinned to the same anchor images; the four baseline
  # anchors above are untouched. They exist to prove instance-fact reads:
  # mysql84-4k runs InnoDB on 4KB pages (index bound 768), tidb85-12288 sets
  # tidb-server max-index-length=12288.

  mysql84-4k:
    image: mysql:8.4.10
    container_name: deltascope-ddl-golden-mysql84-4k
    ports:
      - "127.0.0.1:23394:3306"
    command:
      - --innodb-page-size=4096
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golden
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  tidb85-12288:
    image: pingcap/tidb:v8.5.0
    container_name: deltascope-ddl-golden-tidb85-12288
    ports:
      - "127.0.0.1:24001:4000"
    volumes:
      - ./tidb/ddl-golden-max-index-length.toml:/tidb-aux.toml:ro
    command:
      - --store=unistore
      - --path=
      - --config=/tidb-aux.toml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  tidb85-12288-client:
    image: mysql:8.4.10
    container_name: deltascope-ddl-golden-tidb85-12288-client
    depends_on:
      tidb85-12288:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h tidb85-12288 -P 4000 -uroot -Nse 'SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # --- T23-S real TiKV-backed stack + alter-primary-key aux (issue #102) --
  # Authorization-gated fixtures: only testdata/ddl-golden/T23S.json names
  # these services, so the frozen T23 and T21 runs never start them. All
  # images pinned to the same v8.5.0 as the tidb85 anchor. Topology is the
  # documented minimum for a real TiFlash replica: one PD, one TiKV, one
  # TiFlash store, one TiDB server on --store=tikv, one mysql client. The
  # tidb85-apk aux TiDB is a separate unistore instance whose startup config
  # sets alter-primary-key=true; it is deliberately NOT joined to the TiKV
  # cluster so SHOW CONFIG never returns conflicting alter-primary-key rows.

  t23s-pd:
    image: pingcap/pd:v8.5.0
    container_name: deltascope-ddl-golden-t23s-pd
    ports:
      - "127.0.0.1:24379:2379"
    volumes:
      # attempt-1 config delivery: the source is the dedicated read-only
      # VM share mounted at this absolute guest path (profile mount
      # maps a staging dir containing the frozen copies). Long syntax +
      # create_host_path:false makes a missing source a hard failure
      # instead of dockerd silently creating a directory.
      - type: bind
        source: /Users/fan/GolangProjects/DeltaScope/docker/tidb/t23s-pd.toml
        target: /pd.toml
        read_only: true
        bind:
          create_host_path: false
    command:
      - --name=t23s-pd
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://t23s-pd:2379
      - --advertise-peer-urls=http://t23s-pd:2380
      - --initial-cluster=t23s-pd=http://t23s-pd:2380
      - --config=/pd.toml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2379/pd/api/v1/health 2>/dev/null | grep -q health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  t23s-tikv:
    image: pingcap/tikv:v8.5.0
    container_name: deltascope-ddl-golden-t23s-tikv
    depends_on:
      t23s-pd:
        condition: service_healthy
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=t23s-tikv:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=t23s-tikv:20180
      - --data-dir=/data
      - --pd=t23s-pd:2379
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:20180/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  t23s-tiflash:
    image: pingcap/tiflash:v8.5.0
    container_name: deltascope-ddl-golden-t23s-tiflash
    depends_on:
      t23s-tikv:
        condition: service_healthy
    volumes:
      - type: bind
        source: /Users/fan/GolangProjects/DeltaScope/docker/tidb/t23s-tiflash.toml
        target: /tiflash/tiflash.toml
        read_only: true
        bind:
          create_host_path: false
    command:
      - --config-file=/tiflash/tiflash.toml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8234/metrics >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  t23s-tidb:
    image: pingcap/tidb:v8.5.0
    container_name: deltascope-ddl-golden-t23s-tidb
    depends_on:
      t23s-tikv:
        condition: service_healthy
      t23s-tiflash:
        condition: service_healthy
    ports:
      - "127.0.0.1:24002:4000"
    command:
      - --store=tikv
      - --path=t23s-pd:2379
      - --advertise-address=t23s-tidb
      - --status=10080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  t23s-tidb-client:
    image: mysql:8.4.10
    container_name: deltascope-ddl-golden-t23s-tidb-client
    depends_on:
      t23s-tidb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h t23s-tidb -P 4000 -uroot -Nse 'SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  tidb85-apk:
    image: pingcap/tidb:v8.5.0
    container_name: deltascope-ddl-golden-tidb85-apk
    ports:
      - "127.0.0.1:24003:4000"
    volumes:
      - type: bind
        source: /Users/fan/GolangProjects/DeltaScope/docker/tidb/t23s-apk.toml
        target: /tidb-apk.toml
        read_only: true
        bind:
          create_host_path: false
    command:
      - --store=unistore
      - --path=
      - --config=/tidb-apk.toml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  tidb85-apk-client:
    image: mysql:8.4.10
    container_name: deltascope-ddl-golden-tidb85-apk-client
    depends_on:
      tidb85-apk:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h tidb85-apk -P 4000 -uroot -Nse 'SELECT 1' | grep -qx '1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
