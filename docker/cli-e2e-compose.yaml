services:
  mysql:
    image: mysql:8.4
    container_name: deltascope-cli-e2e-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "3406:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  tidb:
    image: pingcap/tidb:v8.5.0
    container_name: deltascope-cli-e2e-tidb
    command:
      - --store=unistore
      - --path=
    ports:
      - "4400:4000"
      - "10080:10080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  mysql-client:
    image: mysql:8.4
    container_name: deltascope-cli-e2e-mysql-client
    depends_on:
      tidb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mysql --protocol=tcp -h tidb -P 4000 -uroot < /docker-entrypoint-initdb.d/tidb-init.sql && exec sleep infinity
    volumes:
      - ./tidb/init.sql:/docker-entrypoint-initdb.d/tidb-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h tidb -P 4000 -uroot -Nse \"SELECT CONCAT((SELECT COUNT(*) FROM app.users), ':', (SELECT COUNT(*) FROM app.orders), ':', (SELECT COUNT(*) FROM app.accounts), ':', (SELECT COUNT(*) FROM archive.users))\" | grep -qx '2:2:2:1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
