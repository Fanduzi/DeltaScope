# TLS E2E fixture for DeltaScope HTTP audit.
# Tests TLS-enabled MySQL and PostgreSQL connections with certificate validation.

services:
  mysql-tls:
    image: mysql:8.4
    container_name: deltascope-tls-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    volumes:
      - ./mysql-tls-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./certs/trusted/mysql-tls-cert.pem:/etc/mysql/ssl/server-cert.pem:ro
      - ./certs/trusted/mysql-tls-key.pem:/etc/mysql/ssl/server-key.pem:ro
      - ./certs/trusted/trusted-ca-cert.pem:/etc/mysql/ssl/ca-cert.pem:ro
    command: >
      --require-secure-transport=ON
      --ssl-ca=/etc/mysql/ssl/ca-cert.pem
      --ssl-cert=/etc/mysql/ssl/server-cert.pem
      --ssl-key=/etc/mysql/ssl/server-key.pem
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgresql-tls:
    image: postgres:17
    container_name: deltascope-tls-postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: app
    volumes:
      - ./postgresql-tls-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./certs/trusted/postgresql-tls-cert.pem:/var/lib/postgresql/server-cert.pem:ro
      - ./certs/trusted/postgresql-tls-key.pem:/var/lib/postgresql/server-key.pem:ro
      - ./certs/trusted/trusted-ca-cert.pem:/var/lib/postgresql/ca-cert.pem:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server-cert.pem
      -c ssl_key_file=/var/lib/postgresql/server-key.pem
      -c ssl_ca_file=/var/lib/postgresql/ca-cert.pem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d app && psql -U root -d app -c 'SELECT 1 FROM app.users LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
