# docs/examples/github-actions.yml
#
# Example GitHub Actions workflow that audits SQL migration files with DeltaScope.
# Copy it into .github/workflows/ and adapt the file paths to your repository.
#
# The job runs three steps:
#   1. a `config lint --strict` gate, only when deltascope.yaml exists,
#   2. inline annotations via --format github-actions,
#   3. a short job summary via --format github-summary, appended to $GITHUB_STEP_SUMMARY.
#
# The job uses only the default contents: read permission. It posts no PR
# comments and makes no GitHub API calls; annotations and the summary are
# produced entirely by the local CLI.
#
# NOTE: the github-summary format and the [level] rule_id annotation wording
# ship in DeltaScope v0.330.0. The CLI pin below is set to v0.330.0, which is
# the first release that carries both, so the --format github-summary step
# resolves to a build that supports it.

name: SQL Audit

on:
  push:
    paths:
      - 'migrations/**'
      - 'deltascope.yaml'
  pull_request:
    paths:
      - 'migrations/**'
      - 'deltascope.yaml'

# Limit concurrent runs on the same branch/PR so audits are not duplicated.
concurrency:
  group: sql-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: DeltaScope SQL Audit
    runs-on: ubuntu-latest
    permissions:
      # Read-only access to the repository is enough. No write scopes and no
      # PR comment posting are required.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DeltaScope CLI
        # Pin a specific release for reproducible audits. v0.330.0 is the first
        # release that ships github-summary and the annotation wording
        # referenced by the steps below; bump the pin when you adopt a newer
        # release.
        env:
          DELTASCOPE_VERSION: v0.330.0
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Fanduzi/DeltaScope/${DELTASCOPE_VERSION}/install.sh" | sh
          deltascope --version

      # Gate the policy config before auditing SQL. --strict fails the job
      # (exit 2) when config lint reports rule-level replacement hazards. When
      # no deltascope.yaml is checked in, the default policy is used instead.
      - name: Lint policy config
        shell: bash
        run: |
          if [[ -f deltascope.yaml ]]; then
            deltascope config lint --file deltascope.yaml --strict
          else
            echo "No deltascope.yaml found; DeltaScope will use the default policy."
          fi

      # Inline annotations in the workflow log. Replace ./migrations.sql with
      # the path to your migration file (or expand a glob in the shell).
      # CONFIG_ARGS is rebuilt in each step, so a missing deltascope.yaml does
      # not make --config fail.
      - name: Audit SQL (inline annotations)
        env:
          MIGRATION_FILE: ./migrations.sql
        shell: bash
        run: |
          CONFIG_ARGS=()
          if [[ -f deltascope.yaml ]]; then
            CONFIG_ARGS=(--config deltascope.yaml)
          fi
          deltascope audit "${CONFIG_ARGS[@]}" \
            --dialect postgresql \
            --file "$MIGRATION_FILE" \
            --format github-actions

      # Short human summary on the run page. if: always() keeps this step
      # running even when the annotations step exits non-zero on blockers, so
      # reviewers always see the verdict, counts, and Action Summary. With
      # --fail-on none, writing the summary itself never fails the job.
      - name: Write job summary
        if: always()
        env:
          MIGRATION_FILE: ./migrations.sql
        shell: bash
        run: |
          CONFIG_ARGS=()
          if [[ -f deltascope.yaml ]]; then
            CONFIG_ARGS=(--config deltascope.yaml)
          fi
          deltascope audit "${CONFIG_ARGS[@]}" \
            --dialect postgresql \
            --file "$MIGRATION_FILE" \
            --format github-summary \
            --fail-on none >> "$GITHUB_STEP_SUMMARY"
