name: select_cte
dialect: postgresql
mode: strict
expect:
  read_classification: read_only
  admission: indeterminate
  relations:
    - name: cte
      kind: cte
      permission_required: true
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: cte
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [cte.id]
  requirements:
    - object: cte
      privilege: read_table
    - object: cte.id
      privilege: read_column
    - object: users
      privilege: read_table
  unresolved: []
  warnings: []
  reason_codes: []
