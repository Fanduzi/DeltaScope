name: select_cte
dialect: postgresql
mode: strict
expect:
  read_classification: indeterminate
  admission: indeterminate
  relations:
    - name: cte
      kind: cte
      permission_required: false
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [users.id]
  requirements:
    - object: unqualified_relation
      privilege: indeterminate
  unresolved:
    - reference: unqualified_relation
      reason: unqualified_relation_blocked
  warnings: []
  reason_codes: [unqualified_relation_blocked]
