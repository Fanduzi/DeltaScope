name: select_cte
dialect: postgresql
mode: strict
expect:
  read_classification: read_only
  admission: indeterminate
  relations:
    - name: users
      kind: table
      permission_required: true
    - name: cte
      kind: cte
      permission_required: false
  referenced_columns:
    - table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [users.id]
  requirements:
    - object: users
      privilege: read_table
    - object: users.id
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
