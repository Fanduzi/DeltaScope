name: select_with_where
dialect: postgresql
mode: strict
expect:
  read_classification: indeterminate
  admission: indeterminate
  relations:
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: users
      column: id
      usages: [projection, filter]
  outputs:
    - name: id
      sources: [users.id]
  requirements:
    - object: unqualified_relation
      privilege: indeterminate
  unresolved:
    - reference: unqualified_relation
      reason: unqualified_relation_blocked
  warnings: []
  reason_codes: [unproven_operator_effect, unqualified_relation_blocked]
