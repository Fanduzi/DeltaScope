name: select_limit_subquery
dialect: postgresql
mode: strict
expect:
  read_classification: read_only
  admission: indeterminate
  relations:
    - schema: public
      name: config
      kind: table
      permission_required: true
    - schema: public
      name: users
      kind: table
      permission_required: true
  referenced_columns:
    - schema: public
      table: config
      column: max_val
      usages: [limit]
    - schema: public
      table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [public.users.id]
  requirements:
    - object: public.config
      privilege: read_table
    - object: public.config.max_val
      privilege: read_column
    - object: public.users
      privilege: read_table
    - object: public.users.id
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
