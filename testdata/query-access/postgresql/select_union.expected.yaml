name: select_union
dialect: postgresql
mode: strict
expect:
  admission: indeterminate
  relations:
    - name: orders
      kind: table
      permission_required: true
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: orders
      column: id
      usages: [projection]
    - table: users
      column: id
      usages: [projection]
  outputs: []
  requirements:
    - object: unqualified_relation
      privilege: indeterminate
  unresolved:
    - reference: unqualified_relation
      reason: unqualified_relation_blocked
  warnings: []
  reason_codes:
    - unqualified_relation_blocked
