name: select_with_join_on
dialect: postgresql
mode: strict
expect:
  read_classification: indeterminate
  admission: indeterminate
  relations:
    - name: orders
      alias: o
      kind: table
      permission_required: true
    - name: users
      alias: u
      kind: table
      permission_required: true
  referenced_columns:
    - table: o
      column: user_id
      usages: [join]
    - table: u
      column: id
      usages: [join]
  outputs:
    - name: "*"
      sources: ["*"]
  requirements:
    - object: o.user_id
      privilege: read_column
    - object: orders
      privilege: read_table
    - object: u.id
      privilege: read_column
    - object: users
      privilege: read_table
  unresolved: []
  warnings: []
  reason_codes: []
