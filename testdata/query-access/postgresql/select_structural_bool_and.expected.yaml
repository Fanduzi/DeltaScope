name: select_structural_bool_and
dialect: postgresql
mode: strict
expect:
  # Structural BoolExpr alone is not a catalog identity effect (T2/T3).
  # Classification may be read_only; admission stays indeterminate without effect identity proof path.
  read_classification: read_only
  admission: indeterminate
  relations:
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: users
      column: active
      usages: [filter]
    - table: users
      column: id
      usages: [projection]
    - table: users
      column: inactive
      usages: [filter]
  outputs:
    - name: id
      sources: [users.id]
  requirements:
    - object: users
      privilege: read_table
    - object: users.active
      privilege: read_column
    - object: users.id
      privilege: read_column
    - object: users.inactive
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
