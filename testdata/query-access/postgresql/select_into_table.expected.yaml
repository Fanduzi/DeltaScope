name: select_into_table
dialect: postgresql
mode: strict
expect:
  read_classification: not_read_only
  admission: rejected
  relations:
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [users.id]
  requirements:
    - object: unqualified_relation
      privilege: indeterminate
  unresolved:
    - reference: unqualified_relation
      reason: unqualified_relation_blocked
  warnings: []
  reason_codes: [unqualified_relation_blocked]
