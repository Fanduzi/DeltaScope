      sources: [public.users.id]
  requirements:
    - object: public.users
      privilege: read_table
    - object: public.users.id
      privilege: read_column
    - object: public.users.secret_flag
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
