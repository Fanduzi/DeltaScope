name: data_modifying_cte
dialect: postgresql
mode: strict
expect:
  read_classification: not_read_only
  admission: indeterminate
  relations:
    - name: d
      kind: cte
      permission_required: true
  referenced_columns:
    - table: d
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [d.id]
  requirements:
    - object: d
      privilege: read_table
    - object: d.id
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
