name: select_union
dialect: mysql
mode: strict
expect:
  read_classification: read_only
  admission: admissible
  relations:
    - name: orders
      kind: table
      permission_required: true
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: orders
      column: id
      usages: [projection]
    - table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [users.id]
    - name: id
      sources: [orders.id]
  requirements:
    - object: orders
      privilege: read_table
    - object: orders.id
      privilege: read_column
    - object: users
      privilege: read_table
    - object: users.id
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
