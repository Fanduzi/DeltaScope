name: select_schema_qualified
dialect: mysql
mode: strict
expect:
  read_classification: read_only
  admission: admissible
  relations:
    - schema: app
      name: users
      kind: table
      permission_required: true
  referenced_columns:
    - schema: app
      table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [app.users.id]
  requirements:
    - object: app.users
      privilege: read_table
    - object: app.users.id
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
