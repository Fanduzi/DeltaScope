name: select_nested_cte
dialect: mysql
mode: strict
expect:
  read_classification: read_only
  admission: admissible
  relations:
    - name: a
      kind: cte
      permission_required: false
    - name: b
      kind: cte
      permission_required: false
    - name: users
      kind: table
      permission_required: true
  referenced_columns:
    - table: users
      column: id
      usages: [projection]
  outputs:
    - name: id
      sources: [users.id]
  requirements:
    - object: users
      privilege: read_table
    - object: users.id
      privilege: read_column
  unresolved: []
  warnings: []
  reason_codes: []
