name: check_lifecycle
dialect: tidb
category: ddl
expect:
  parse_ok: true
  statement_kind: ddl
  operation: alter_table
  statements:
    count: 3
  unsupported:
    count: 0
  findings:
    include:
      - ddl.constraint.check.not_enforced.notice
      - ddl.alter.alter_check.exists.require
      - ddl.alter.drop_check.exists.require
metadata:
  schema: app
  instance:
    version: "8.0.11-TiDB-v8.5.0"
    tidb_enable_check_constraint: true
    tidb_enable_check_constraint_known: true
  tables:
    t:
      exists: true
      columns:
        - {name: id, type: int}
      constraints:
        - {type: check, name: chk_id, columns: [id], enforced: enforced}
