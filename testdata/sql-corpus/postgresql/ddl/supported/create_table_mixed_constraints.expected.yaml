name: create_table_mixed_constraints
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  statement_kind: ddl
  operation: create_table
  unsupported:
    count: 0
  findings:
    include:
      - ddl.table.foreign_key.forbid
    exclude:
      - ddl.alter.drop_primary_key.forbid
facts:
  constraints:
    - type: foreign_key
      referenced_table: users
      referenced_columns: [id]
