name: create_table_constraints
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  statement_kind: ddl
  operation: create_table
  unsupported:
    count: 0
  findings:
    include: []
    exclude:
      - ddl.alter.drop_primary_key.forbid
  facts:
    constraints:
      - type: foreign_key
        referenced_table: users
        referenced_columns: [id]
