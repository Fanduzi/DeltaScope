name: rule_coverage_metadata
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  unsupported:
    count: 0
  findings:
    include:
      - ddl.table.exists.alter.require
      - ddl.alter.add_index.exists.forbid
      - ddl.alter.rename_column.exists.require
      - ddl.table.drop.rows.max_count
      - ddl.table.truncate.rows.max_count
config:
  rules:
    ddl.table.drop.rows.max_count:
      enabled: true
      params: {limit: 100}
    ddl.table.truncate.rows.max_count:
      enabled: true
      params: {limit: 100}
metadata:
  schema: public
  instance: {version: PostgreSQL 17.7}
  tables:
    missing_table:
      exists: false
    users:
      exists: true
      pg_columns:
        ordinary: true
        columns: [{name: existing, identity: "", generated: "", type_width: 32, not_null: false, has_default: false, primary_key: false}]
      columns:
        - {name: existing, type: integer}
      indexes:
        - {name: existing_idx, kind: unique, columns: [existing]}
    big_table:
      exists: true
      options:
        table_rows: "1000"
