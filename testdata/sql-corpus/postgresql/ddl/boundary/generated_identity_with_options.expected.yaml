name: generated_identity_with_options
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  unsupported:
    count: 1
    include:
      - generated_as_identity
    metadata:
      - feature: generated_as_identity
        metadata:
          column: id
          generated_when: d
          is_identity: true
          identity_options:
            start: 10
            increment: 5
            minvalue: 1
            maxvalue: 9999
            cache: 20
            cycle: true
  findings:
    include: []
    exclude: []
