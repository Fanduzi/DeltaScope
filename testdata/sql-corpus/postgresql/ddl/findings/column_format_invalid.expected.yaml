  tables:
    storage_t:
      exists: true
      pg_columns: &fixed
        ordinary: true
        columns: [{name: id, identity: '', generated: '', type_width: 32, type_storage: p, not_null: false, has_default: false, primary_key: false}]
    compression_t:
      exists: true
      pg_columns: *fixed
