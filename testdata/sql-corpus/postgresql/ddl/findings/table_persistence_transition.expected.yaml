name: table_persistence_transition
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
  pg_table_persistences:
    - {schema: app, table: t, current: p, direct_publication: true}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.pg.alter.persistence.transition.valid, ddl.pg.alter.set_unlogged.notice]
