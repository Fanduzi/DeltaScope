name: alter_table_add_foreign_key_rule_coverage
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  unsupported:
    count: 0
  findings:
    include:
      - ddl.table.foreign_key.forbid
      - ddl.pg.table.foreign_key.cross_schema.advisory
  facts:
    constraints:
      - type: foreign_key
        name: fk_orders_user
        columns: [user_id]
        referenced_table: users
        referenced_columns: [id]
      - type: foreign_key
        name: fk_orders_approver
        columns: [approver_id]
        referenced_schema: auth
        referenced_table: users
        referenced_columns: [id]
