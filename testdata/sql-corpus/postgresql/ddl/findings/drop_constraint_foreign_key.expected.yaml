name: drop_constraint_foreign_key
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_columns: {ordinary: true, columns: []}
      pg_constraints: [{name: " Exact Key ", type: u, validated: true}]
  pg_drop_constraint_references:
    - {schema: app, table: t, name: " Exact Key ", kind: u, blocked: true}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.pg.alter.drop_constraint.target.require]
