name: validate_check_only
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_constraints: [{name: ck, type: c, validated: false, validation_children: true}]
expect:
