name: partition_add_column_guard
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_columns: {ordinary: false, columns: []}
  pg_column_traversals:
    - {schema: app, table: t, column: id, partition: true, column_exists: true}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.alter.add_column.exists.forbid]
