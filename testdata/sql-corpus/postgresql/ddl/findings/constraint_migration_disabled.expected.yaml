name: constraint_migration_disabled
dialect: postgresql
category: ddl
config:
  rules:
    ddl.table.foreign_key.forbid:
      enabled: false
    ddl.pg.alter.add_foreign_key.not_valid.require:
      enabled: false
    ddl.pg.alter.add_primary_key.concurrent_index.warn:
      enabled: false
expect:
  parse_ok: true
  findings:
    exclude: [ddl.pg.alter.add_foreign_key.not_valid.require, ddl.pg.alter.add_primary_key.concurrent_index.warn]
