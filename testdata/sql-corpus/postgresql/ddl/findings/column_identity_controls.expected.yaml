name: column_identity_controls
dialect: postgresql
category: ddl
config:
  rules:
    ddl.alter.rename_column.forbid: {enabled: false}
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    absent:
      exists: false
      pg_relation: {name: absent}
    sequence_name:
      exists: false
      pg_relation: {name: sequence_name, kind: S}
    guard_existing: &table
      exists: true
      pg_columns:
        ordinary: true
        columns: [{name: id, identity: '', generated: '', type_width: 32, not_null: false, has_default: false, primary_key: false}, {name: ' ', identity: '', generated: '', type_width: 32, not_null: false, has_default: false, primary_key: false}]
    fresh: *table
    rename_spaces: *table
expect:
  parse_ok: true
  statements: {count: 5}
  unsupported: {count: 0}
  findings:
    exclude:
      - ddl.table.exists.alter.require
      - ddl.alter.add_column.exists.forbid
      - ddl.alter.rename_column.exists.require
      - ddl.alter.rename_column.target.exists.forbid
      - ddl.pg.alter.add_column.non_null_no_default.warn
