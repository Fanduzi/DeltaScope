name: constraint_using_index
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_columns: {ordinary: true, columns: []}
  pg_constraint_indexes:
    - {schema: app, table: t, name: " Exact Index ", kind: i, valid: false}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.pg.alter.constraint_using_index.valid]
