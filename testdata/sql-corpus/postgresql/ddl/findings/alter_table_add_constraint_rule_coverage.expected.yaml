name: alter_table_add_constraint_rule_coverage
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  unsupported:
    count: 0
  findings:
    include:
      - ddl.table.primary_key.bigint.require
      - ddl.alter.add_index.unique.prefix.require
config:
  rules:
    ddl.table.primary_key.bigint.require:
      enabled: true
      params: {required: true}
    ddl.alter.add_index.unique.prefix.require:
      enabled: true
      params: {required: true, prefix: uniq_}
