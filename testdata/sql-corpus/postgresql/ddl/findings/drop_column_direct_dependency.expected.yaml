name: drop_column_direct_dependency
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_columns: {ordinary: true, columns: [{name: " Exact Column ", identity: "", generated: "", type_width: 32, not_null: false, has_default: false, primary_key: false}]}
  pg_drop_column_dependencies:
    - {schema: app, table: t, column: " Exact Column ", kind: view}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.alter.drop_column.exists.require]
