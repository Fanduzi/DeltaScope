name: drop_constraint_inherited_check
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_constraints: [{name: ck, type: c, validated: true, inherited: true}]
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.pg.alter.drop_constraint.target.require]
