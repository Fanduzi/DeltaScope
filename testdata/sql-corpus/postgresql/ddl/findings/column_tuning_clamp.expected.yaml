name: column_tuning_clamp
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_columns:
        ordinary: true
        columns: [{name: id, identity: '', generated: '', type_width: 64, not_null: false, has_default: false, primary_key: false}]
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.pg.alter.column.statistics.clamp.warn]
    exclude: [ddl.pg.alter.column.statistics.target.valid, ddl.pg.alter.column.options.valid]
