name: alter_table_add_check_rule_coverage
dialect: postgresql
category: ddl
expect:
  parse_ok: true
  unsupported:
    count: 0
  findings:
    include:
      - ddl.constraint.check.name.prefix.require
      - ddl.pg.alter.add_check.not_valid.require
config:
  rules:
    ddl.constraint.check.name.prefix.require:
      enabled: true
      params: {prefix: ck_}
facts:
  constraints:
    - type: check
      name: amount_positive
      columns: [amount]
