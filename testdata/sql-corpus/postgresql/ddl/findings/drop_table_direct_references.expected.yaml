name: drop_table_direct_references
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
  pg_destructive_references:
    - {operation: drop_references, schema: app, table: t, blocked_position: 1}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.table.drop.exists.require]
