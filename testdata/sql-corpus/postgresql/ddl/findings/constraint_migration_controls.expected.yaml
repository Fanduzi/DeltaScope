name: constraint_migration_controls
dialect: postgresql
category: ddl
config:
  rules:
    ddl.table.foreign_key.forbid:
      enabled: false
expect:
  parse_ok: true
  statements:
    count: 4
  unsupported:
    count: 0
  findings:
    exclude: [ddl.pg.alter.add_foreign_key.not_valid.require, ddl.pg.alter.add_primary_key.concurrent_index.warn, ddl.pg.alter.add_unique_constraint.concurrent_index.advisory, ddl.pg.alter.not_valid_constraint.validate.require]
