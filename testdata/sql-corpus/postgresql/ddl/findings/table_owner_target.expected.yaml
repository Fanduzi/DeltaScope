name: table_owner_target
dialect: postgresql
category: ddl
metadata:
  schema: app
  instance: {version: PostgreSQL 17.7}
  tables:
    t:
      exists: true
      pg_relation: {name: t, kind: r}
      pg_columns: {ordinary: true, columns: []}
  pg_table_owners:
    - {schema: app, table: t, kind: named, name: " Missing Owner ", exists: false}
expect:
  parse_ok: true
  statements: {count: 1}
  unsupported: {count: 0}
  findings:
    include: [ddl.pg.alter.owner.target.valid, ddl.pg.alter.owner.advisory]
