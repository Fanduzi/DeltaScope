name: lifecycle_notice_rules
dialect: mysql
category: ddl
metadata:
  instance:
    version: "8.0.36"
    mysql_resource_group_feature_known: true
    mysql_resource_group_feature_supported: true
    mysql_resource_group_priority_cap_known: true
    mysql_resource_group_priority_capable: true
    mysql_host_vcpus_known: true
    mysql_host_vcpus: 8
    mysql_resource_group_admin_known: true
    mysql_resource_group_admin: true
    mysql_resource_group_bound:
      rg1: false
  mysql_resource_groups:
    rg1:
      status: confirmed
      exists: true
expect:
  parse_ok: true
  unsupported:
    count: 5
    include:
      - create_procedure.body
      - create_user.option.identified
      - alter_user.option.identified
      - grant.unaudited_targets
      - revoke.unaudited_targets
  findings:
    include:
      - ddl.rename_table.notice
      - ddl.create_index.notice
      - ddl.drop_index.notice
      - ddl.alter_database.notice
      - ddl.create_procedure.notice
      - ddl.drop_procedure.notice
      - ddl.create_user.notice
      - ddl.alter_user.notice
      - ddl.drop_user.notice
      - ddl.create_role.notice
      - ddl.drop_role.notice
      - ddl.grant.notice
      - ddl.revoke.notice
      - ddl.drop_resource_group.notice
      - ddl.alter.add_column.notice
      - ddl.alter.add_constraint.notice
      - ddl.alter.drop_column.notice
      - ddl.alter.modify_column.notice
      - ddl.alter.drop_index.notice
      - ddl.alter.drop_foreign_key.notice
