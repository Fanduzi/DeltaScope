name: mysql_resource_group_lifecycle_rules
dialect: mysql
category: ddl
metadata:
  instance:
    version: "8.0.36"
    mysql_resource_group_feature_known: true
    mysql_resource_group_feature_supported: true
    mysql_resource_group_priority_cap_known: true
    mysql_resource_group_priority_capable: true
    mysql_host_vcpus_known: true
    mysql_host_vcpus: 8
    mysql_resource_group_admin_known: true
    mysql_resource_group_admin: true
    mysql_read_only_known: true
    mysql_super_read_only_known: true
  mysql_resource_groups:
    rg_cpu:
      status: not_found
    rg_absent:
      status: not_found
expect:
  parse_ok: true
  findings:
    include:
      - ddl.create_resource_group.notice
      - ddl.alter_resource_group.notice
      - ddl.mysql.resource_group.valid
      - ddl.mysql.resource_group.force.warn
      - ddl.mysql.resource_group.affinity.warn
