name: column_identity
dialect: mysql
category: ddl
expect:
  parse_ok: true
  unsupported:
    count: 0
  findings:
    include:
      - ddl.alter.change_column.target.exists.forbid
      - ddl.alter.rename_column.target.exists.forbid
      - ddl.alter.rename_column.version.require
metadata:
  schema: app
  instance:
    version: "5.7.44"
  tables:
    ident_change:
      exists: true
      columns:
        - {name: c, type: int}
        - {name: c2, type: int}
    ident_rename:
      exists: true
      columns:
        - {name: c, type: int}
        - {name: c2, type: int}
    ident_version:
      exists: true
      columns:
        - {name: c, type: int}
