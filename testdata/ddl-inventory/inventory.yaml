rows:
  # ================= MySQL: database/schema lifecycle =================
  - id: mysql.create-database
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: database
    subactions: ["CREATE DATABASE/SCHEMA", "IF NOT EXISTS", "CHARACTER SET", "COLLATE", "DEFAULT ENCRYPTION (8.0.16+)"]
    sql_shape: "CREATE DATABASE app CHARACTER SET utf8mb4"
    prerequisites: "none"
    status: semantically_checked
    parser_status: recognized
    audit_status: audited
    applicability:
      - anchor: mysql57
        version_range: 5.7
        official_presence: documented
        product_scope: registered
        parser_status: recognized
        audit_status: audited
        evidence: ["file:internal/application/audit/batch_state_schema.go", "file:internal/domain/rule/ddl/lifecycle_t17_rules.go", "file:testdata/ddl-golden/T17.json", "file:testdata/sql-corpus/mysql/ddl/findings/database_lifecycle_rules.sql"]
      - anchor: mysql80
        version_range: 8.0
        official_presence: documented
        product_scope: registered
        parser_status: recognized
        audit_status: audited
        evidence: ["file:internal/application/audit/batch_state_schema.go", "file:internal/domain/rule/ddl/lifecycle_t17_rules.go", "file:testdata/ddl-golden/T17.json", "file:testdata/sql-corpus/mysql/ddl/findings/database_lifecycle_rules.sql"]
      - anchor: mysql84
        version_range: 8.4
        official_presence: documented
        product_scope: registered
        parser_status: recognized
        audit_status: audited
        evidence: ["file:internal/application/audit/batch_state_schema.go", "file:internal/domain/rule/ddl/lifecycle_t17_rules.go", "file:testdata/ddl-golden/T17.json", "file:testdata/sql-corpus/mysql/ddl/findings/database_lifecycle_rules.sql"]

    status_evidence: "2026-10 T17 closeout (#96): schema ordered-state models present/absent/unknown with proven default attributes; CREATE SCHEMA synonym normalizes identically; IF NOT EXISTS publishes convergent present over unvouched only when all create options Apply and both arms converge (attributes withheld, batchCreated=false); MySQL tiflash is a proven refusal and other unextracted options withhold unless another option proves refusal; ddl.database.create.exists.forbid fires on proven-present (1007 probed) with schema.existence gap when unvouched; DEFAULT ENCRYPTION modeled — lands on 8.0/8.4 (SCHEMATA DEFAULT_ENCRYPTION YES/NO), proven 1064 refusal below 8.0.16 via ddl.database.option.encryption.applicability with target.version gap when unresolved; charset/collate now consumed modeled aspects (coverage complete). T17.json golden suite 47/47 on mysql57/80/84+tidb85 (probes in docs/work-plans/t17-database-schema-lifecycle/). Earlier evidence: 2026-09-24 T03 rework (#82) bounded unsupported create_schema.option.charset/collate; 2026-09-22 CLI probe generic notice only"
    targets: "database identity, default charset/collation, encryption attribute"
    acceptance:
      dimensions: "charset/collation capture, existence conditional, drop counterpoint"
      refs: ["file:internal/application/audit/batch_state_schema.go", "file:internal/domain/rule/ddl/lifecycle_t17_rules.go", "file:testdata/ddl-golden/T17.json", "file:testdata/sql-corpus/mysql/ddl/findings/database_lifecycle_rules.sql"]
    owner: T17

  - id: mysql.alter-database
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: database
    subactions: ["ALTER DATABASE/SCHEMA", "CHARACTER SET", "COLLATE", "READ ONLY (8.0.22+)"]
    sql_shape: "ALTER DATABASE app CHARACTER SET utf8mb4"
    prerequisites: "none"
    status: semantically_checked
    parser_status: recognized
    audit_status: audited
    applicability:
      - anchor: mysql57
        version_range: 5.7
        official_presence: documented
        product_scope: registered
        parser_status: recognized
        audit_status: audited
        evidence: ["file:internal/application/audit/batch_state_schema.go", "file:internal/domain/rule/ddl/lifecycle_t17_rules.go", "file:testdata/ddl-golden/T17.json", "file:testdata/sql-corpus/mysql/ddl/findings/database_lifecycle_rules.sql"]
      - anchor: mysql80
        version_range: 8.0
        official_presence: documented
        product_scope: registered
        parser_status: recognized
        audit_status: audited
        evidence: ["file:internal/application/audit/batch_state_schema.go", "file:internal/domain/rule/ddl/lifecycle_t17_rules.go", "file:testdata/ddl-golden/T17.json", "file:testdata/sql-corpus/mysql/ddl/findings/database_lifecycle_rules.sql"]
      - anchor: mysql84
        version_range: 8.4
        official_presence: documented
        product_scope: registered
