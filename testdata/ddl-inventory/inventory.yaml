rows:
  # ================= MySQL: database/schema lifecycle =================
  - id: mysql.create-database
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: database
    subactions: ["CREATE DATABASE/SCHEMA", "IF NOT EXISTS", "CHARACTER SET", "COLLATE", "DEFAULT ENCRYPTION (8.0.16+)"]
    sql_shape: "CREATE DATABASE app CHARACTER SET utf8mb4"
    prerequisites: "none"
    status: generic_notice
    status_evidence: "2026-09-24 T03 rework (#82): extracted-but-unchecked option facts now carry bounded unsupported evidence (create_schema.option.charset/collate) and coverage=incomplete; option semantics still owned by T17. 2026-09-22 CLI probe: parses; only ddl.database.create.notice fires; charset/collation options unchecked"
    targets: "database identity, default charset/collation, encryption attribute"
    acceptance:
      dimensions: "charset/collation capture, existence conditional, drop counterpoint"
      refs: ["missing: owner adds fixture and policy evidence"]
    owner: T17

  - id: mysql.alter-database
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: database
    subactions: ["ALTER DATABASE/SCHEMA", "CHARACTER SET", "COLLATE", "READ ONLY (8.0.22+)"]
    sql_shape: "ALTER DATABASE app CHARACTER SET utf8mb4"
    prerequisites: "none"
    status: generic_notice
    status_evidence: "2026-09-24 T03 rework (#82): extracted-but-unchecked option facts now carry bounded unsupported evidence (alter_schema.option.charset/collate (unextracted attrs such as placement_policy also surface as alter_schema.option.<name>)) and coverage=incomplete; option semantics still owned by T17. 2026-09-22 CLI probe: parses; only ddl.alter_database.notice fires; attribute changes unchecked"
    targets: "database identity, default attribute transitions"
    acceptance:
      dimensions: "attribute transition capture, IF EXISTS known/unknown handling"
      refs: ["missing: owner adds fixture and policy evidence"]
    owner: T17

  - id: mysql.drop-database
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: database
    subactions: ["DROP DATABASE/SCHEMA", "IF EXISTS"]
    sql_shape: "DROP DATABASE app"
    prerequisites: "none"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.database.drop.warn fires (specific deletion-scope risk rule)"
    targets: "database identity, contained-object deletion scope, IF EXISTS"
    acceptance:
      dimensions: "deletion-scope finding, conditional forms"
      refs: ["file:testdata/sql-corpus/mysql/ddl/supported", "file:internal/application/audit/cross_dialect_ddl_coverage_census_test.go"]
    owner: T17

  # ================= MySQL: table lifecycle =================
  - id: mysql.create-table
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["CREATE TABLE", "IF NOT EXISTS", "column definitions", "inline/table PRIMARY KEY", "UNIQUE", "INDEX", "COMMENT"]
    sql_shape: "CREATE TABLE t (id INT PRIMARY KEY)"
    prerequisites: "InnoDB for engine-dependent checks"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: column-level UNIQUE/PRIMARY KEY GLOBAL record create_table.column.unique_global/primary_key_global evidence (vendor boundary under MySQL); primary-key/comment/audit-column/charset/engine rules fire; golden path executes real CREATE on 4 anchors 2026-09-24 T03 rework (#82): TiDB-only parsed options (auto_random_base, auto_id_cache, shard_row_id_bits, pre_split_regions, TTL family, stats_*, affinity) now record create_table.option.<name> vendor-boundary evidence under MySQL; column-level generated/inline REFERENCES/CHECK/UNIQUE record create_table.column.<name> unaudited evidence. 2026-09-25 T03 rework: SPLIT PRIMARY KEY BETWEEN ... REGIONS records create_table.option.split_index vendor-boundary evidence"
    targets: "table identity, columns, PK, indexes, options"
    acceptance:
      dimensions: "per-statement findings, version-legal column forms, metadata presence/absence"
      refs: ["file:testdata/ddl-golden/T02.json", "file:testdata/sql-corpus/mysql/ddl/findings", "file:testdata/sql-corpus/mysql/ddl/metadata"]
    owner: T06

  - id: mysql.create-table-temporary
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["CREATE TEMPORARY TABLE"]
    sql_shape: "CREATE TEMPORARY TABLE tt (id INT)"
    prerequisites: "none"
    status: generic_notice
    status_evidence: "2026-09-22 evidence: parses and generic table hygiene rules fire, but spec/extractor carry no temporary identity (grep 'temporary' in internal/domain/spec and parser/tidb extractor is empty) — session scope and same-name shadowing are not audited 2026-09-24 T03 rework (#82): extractor now projects TemporaryScope; CREATE TEMPORARY TABLE records unsupported feature create_table.temporary with coverage=incomplete (owner T16 still owns real semantics)"
    targets: "temporary vs persistent identity, same-name shadowing, session scope"
    acceptance:
      dimensions: "temporary identity extraction, shadowing, drop counterpoint"
      refs: ["file:internal/application/audit/cross_dialect_ddl_coverage_census_test.go", "missing: temporary-identity extraction and fixtures"]
    owner: T16

  - id: mysql.create-table-like
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["CREATE TABLE ... LIKE"]
    sql_shape: "CREATE TABLE t2 LIKE t1"
    prerequisites: "source table identity known for completeness"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.table.create_like.forbid plus hygiene rules fire"
    targets: "new table identity, source table reference, copied definition scope"
    acceptance:
      dimensions: "source/target identity, policy on LIKE copies"
      refs: ["file:testdata/sql-corpus/mysql/ddl/findings", "file:internal/application/audit/cross_dialect_ddl_coverage_census_test.go"]
    owner: T16

  - id: mysql.create-table-select
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["CREATE TABLE ... SELECT", "CREATE TABLE ... AS SELECT"]
    sql_shape: "CREATE TABLE t3 AS SELECT * FROM t1"
    prerequisites: "none"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.table.create_as.forbid plus hygiene rules fire"
    targets: "new table identity, SELECT source scope (not executed)"
    acceptance:
      dimensions: "CTAS policy, source scope boundary"
      refs: ["file:testdata/sql-corpus/mysql/ddl/findings"]
    owner: T16

  - id: mysql.create-table-generated-column
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["GENERATED ALWAYS AS (expr)", "VIRTUAL", "STORED", "expression DEFAULT (8.0.13+)", "INVISIBLE column (8.0.23+)"]
    sql_shape: "CREATE TABLE tg (a INT, b INT GENERATED ALWAYS AS (a+1) STORED)"
    prerequisites: "InnoDB"
    status: generic_notice
    status_evidence: "2026-09-22 CLI probe: parses; generic column hygiene rules fire but no generated-dependency/expression-default check; CREATE TABLE with INVISIBLE column is parser_error 2026-09-24 T03 rework (#82): parsed generated column options now surface as create_table.column.generated incomplete evidence until T07 implements dependency semantics"
    targets: "generated column identity, expression dependency edges (b depends on a), storage kind, invisibility"
    acceptance:
      dimensions: "dependency tracking, drop-source protection, version applicability (expr default 8.0.13+, invisible 8.0.23+)"
      refs: ["missing: owner adds dependency and version-boundary fixtures"]
    owner: T07

  - id: mysql.create-table-constraints
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["FOREIGN KEY + REFERENCES + ON DELETE/UPDATE", "CHECK (parsed-but-not-enforced before 8.0.16)", "UNIQUE"]
    sql_shape: "CREATE TABLE tf (id INT, pid INT, CONSTRAINT fk FOREIGN KEY (pid) REFERENCES tp(id))"
    prerequisites: "InnoDB for FK; CHECK enforcement needs 8.0.16+"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.table.foreign_key.forbid fires on CREATE; CHECK parses but no constraint-policy check fires; table-level UNIQUE/PRIMARY KEY ... GLOBAL now records create_table.index.global evidence; 2026-09-24 T03 rework (#82): FK local/referenced key parts beyond plain columns (expression, explicit prefix incl. zero length, DESC) and ON DELETE/UPDATE/MATCH actions now record create_table.constraint.foreign_key.parts evidence — the referenced target and columns are also normalized into the constraint"
    targets: "constraint identity, referenced parent, referential actions, CHECK enforcement state by version"
    acceptance:
      dimensions: "CREATE vs ALTER FK parity (T11), CHECK version semantics (T12), UNIQUE consistency"
      refs: ["file:testdata/sql-corpus/mysql/ddl/findings", "missing: CREATE-vs-ALTER parity fixtures"]
    owner: T11

  - id: mysql.create-table-partitioning
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: partition
    subactions: ["PARTITION BY RANGE/LIST/HASH/KEY", "COLUMNS", "SUBPARTITION (not on TiDB)", "partition options"]
    sql_shape: "CREATE TABLE tp (id INT) PARTITION BY RANGE (id) (PARTITION p0 VALUES LESS THAN (100))"
    prerequisites: "InnoDB native partitioning; ndbcluster has own rules"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.table.partition.forbid fires; range/list corpus fixtures exist; partition topology facts not yet tracked. 2026-09-24 T03 rework (#82): nested partition/sub-partition option lists (e.g. PLACEMENT POLICY inside a partition definition) now surface bounded create_table.option.<name> evidence — MySQL classifies nested TiDB-only options as vendor boundaries just like top-level ones. 2026-09-25: partition UPDATE INDEXES lists record create_table.option.partition_update_indexes evidence (MySQL vendor boundary)"
    targets: "partitioning scheme, partition identities, boundary values, subpartition boundary"
    acceptance:
      dimensions: "scheme capture, boundary fidelity, state visibility for later statements"
      refs: ["file:testdata/sql-corpus/mysql/ddl/boundary/create_table_range_partition.sql", "file:testdata/sql-corpus/mysql/ddl/boundary/create_table_list_partition.sql"]
    owner: T14

  - id: mysql.create-table-options
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["ENGINE", "ROW_FORMAT", "KEY_BLOCK_SIZE", "CHARSET/COLLATE", "COMPRESSION", "ENCRYPTION", "COMMENT", "AUTO_INCREMENT", "STATS_*", "TABLESPACE"]
    sql_shape: "CREATE TABLE t4 (id INT) ENGINE=InnoDB ROW_FORMAT=COMPRESSED KEY_BLOCK_SIZE=8 COMMENT='x'"
    prerequisites: "engine facts required for engine-specific claims"
    status: semantically_checked
    status_evidence: "2026-09-24 T03 rework (#82): extracted-but-unconsumed COLLATE=<name> now carries bounded unsupported evidence (create_table.option.collate) and coverage=incomplete; engine/charset/row_format/auto_increment/comment remain rule-consumed. 2026-09-22 CLI probe: option coverage rules fire for modeled options. 2026-09-23 T03 (#82): unextracted create-table options (e.g. compression, engine_attribute, tablespace) now record bounded unsupported evidence (create_table.option.<name>) and coverage=incomplete. 2026-09-24 T03 rework (#82): the extracted-but-TiDB-only PLACEMENT POLICY=<name> option is a vendor boundary under MySQL (create_table.option.placement_policy)"
    targets: "engine, row format, charset, per-option semantics"
    acceptance:
      dimensions: "option-by-option capture, engine-boundary behavior"
      refs: ["file:testdata/sql-corpus/mysql/ddl/boundary/create_table_options.sql", "missing: per-option semantic fixtures"]
    owner: T15

  - id: mysql.drop-table
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["DROP TABLE", "multi-table list", "IF EXISTS", "TEMPORARY", "RESTRICT/CASCADE"]
    sql_shape: "DROP TABLE t1, t2"
    prerequisites: "none"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.table.drop.forbid fires; T01 proved every list target reaches the denylist (16/16 oracle); golden DROP verified on 4 anchors 2026-09-24 T03 rework (#82): DROP TEMPORARY TABLE records drop_table.temporary incomplete evidence; plain DROP TABLE stays complete (owner T16)"
    targets: "every target identity in source order, existence conditionals, temporary identity"
    acceptance:
      dimensions: "all-target policy evaluation, tuple dedup, deterministic order"
      refs: ["file:docs/research/2026-09-22-ddl-multi-target-denylist-probes.json", "file:testdata/ddl-golden/T02.json", "file:pkg/deltascope/audit_test.go"]
    owner: T16

  - id: mysql.rename-table
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["RENAME TABLE a TO b, c TO d", "ALTER TABLE ... RENAME TO"]
    sql_shape: "RENAME TABLE t1 TO t2, t3 TO t4"
    prerequisites: "unqualified destination resolves to current database (MySQL bug #11493 evidence)"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.rename_table.notice fires; T01/T02 correction proved every source/destination pair reaches denylist with explicit-then-request schema resolution"
    targets: "every old/new pair in order, destination schema resolution, source vs destination identity"
    acceptance:
      dimensions: "all-pair policy evaluation, schema resolution matrix, pair ordering"
      refs: ["file:docs/decisions/2026-09-22-ddl-multi-target-denylist.md", "file:pkg/deltascope/audit_test.go"]
    owner: T01

  - id: mysql.truncate-table
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: table
    subactions: ["TRUNCATE [TABLE]"]
    sql_shape: "TRUNCATE TABLE t1"
    prerequisites: "none"
    status: semantically_checked
    status_evidence: "2026-09-22 CLI probe: ddl.table.truncate.forbid fires (data-deletion risk)"
    targets: "table identity, data deletion semantics"
    acceptance:
      dimensions: "deletion-risk finding, denylist application"
      refs: ["file:testdata/sql-corpus/mysql/ddl/findings"]
    owner: T16

  # ================= MySQL: ALTER TABLE subactions =================
  - id: mysql.alter-table.add-column
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: alter-table
    subactions: ["ADD COLUMN", "ADD COLUMN FIRST/AFTER", "ADD (col, col, ...)"]
    sql_shape: "ALTER TABLE t ADD COLUMN c INT"
    prerequisites: "prior column state for position/duplicate checks"
    status: generic_notice
    status_evidence: "2026-09-22 CLI probe: only ddl.alter.add_column.notice fires offline; exists/duplicate rules need metadata facts 2026-09-24 T03 rework (#82): parsed FIRST/AFTER position clause records alter_table.add_columns.column_position evidence; column options (AUTO_RANDOM vendor boundary, inline UNIQUE/CHECK/REFERENCES unaudited) record alter_table.add_columns.column.<name>"
    targets: "table, new column, position, type/attributes"
    acceptance:
      dimensions: "existence/position evidence, metadata-aware parity"
      refs: ["file:internal/application/audit/cross_dialect_ddl_coverage_census_test.go", "missing: position and existence assertions"]
    owner: T08

  - id: mysql.alter-table.drop-column
    product: mysql
    versions: ["5.7", "8.0", "8.4"]
    sources: [mysql57, mysql80, mysql84]
    family: alter-table
    subactions: ["DROP COLUMN"]
    sql_shape: "ALTER TABLE t DROP COLUMN c"
