# input: versioned official MySQL 5.7/8.0/8.4 and TiDB 8.5 DDL statement lists plus current-tool probe evidence
# output: machine-checkable acceptance inventory rows consumed by the ddl inventory contract gate
# pos: official DDL denominator for the mysql-tidb-ddl-completion milestone (issue #79 task T02/#81)
# note: if this file changes, update this header and testdata README / docs/dev/testing.md.

version: 1
verified: "2026-09-22"
purpose: >
  Versioned official DDL acceptance inventory. Each row is one official
  statement family/subaction scoped to the product versions where it exists,
  with the tool's current observed status, the objects/semantics that must be
  preserved, acceptance dimensions, and the milestone task that owns
  completion. This is the denominator, not a claim that every row is
  supported; rule-fixture coverage percentages are a different metric.

# The dev.mysql.com 5.7 URL silently redirects to the MySQL 9.7 manual, so the
# frozen Oracle-hosted 5.7 mirror is the verified 5.7 source. TiDB release-8.5
# docs are a maintained branch: patch additions after 8.5.0 need explicit
# version evidence before a row may claim them.
sources:
  mysql57:
    url: "https://docs.oracle.com/cd/E17952_01/mysql-5.7-en/sql-data-definition-statements.html"
    verified: "2026-09-22"
    note: "frozen MySQL 5.7 manual mirror (dev.mysql.com 5.7 URL redirects to 9.7)"
  mysql80:
    url: "https://dev.mysql.com/doc/refman/8.0/en/sql-data-definition-statements.html"
    verified: "2026-09-22"
  mysql84:
    url: "https://dev.mysql.com/doc/refman/8.4/en/sql-data-definition-statements.html"
    verified: "2026-09-22"
  mysql-admin:
    url: "https://dev.mysql.com/doc/refman/8.4/en/resource-groups.html"
    verified: "2026-09-22"
    note: "resource-group statements live under Database Administration in the official manual; in scope per issue #79 T24"
  tidb85:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/sql-statements/sql-statement-overview.md"
    verified: "2026-09-22"
  tidb85-ttl:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/time-to-live.md"
    verified: "2026-09-22"
  tidb85-temp:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/temporary-tables.md"
    verified: "2026-09-22"

statuses:
  semantically_checked: "feature-specific semantic/policy check exists AND cited acceptance evidence exists"
  generic_notice: "parses and only generic findings (e.g. *.notice or unrelated hygiene rules) fire; no feature-specific governance"
  parse_only: "parses into a statement but produces zero findings; silent pass"
  parser_unsupported: "the dialect parser cannot parse a vendor-valid form (parser_error diagnostic)"
  vendor_not_supported: "the database product itself does not support the form (explicit boundary, not a to-do feature)"

