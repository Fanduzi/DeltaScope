version: 2
verified: "2026-11-24"
purpose: >
  Versioned official DDL acceptance inventory. Each row is one official
  statement family/subaction scoped to the product versions where it exists,
  with the tool's current observed status, the objects/semantics that must be
  preserved, acceptance dimensions, and the milestone task that owns
  completion. This is the denominator, not a claim that every row is
  supported; rule-fixture coverage percentages are a different metric.

# The dev.mysql.com 5.7 URL silently redirects to the MySQL 9.7 manual, so the
# frozen Oracle-hosted 5.7 mirror is the verified 5.7 source. TiDB release-8.5
# docs are a maintained branch: patch additions after 8.5.0 need explicit
# version evidence before a row may claim them.
sources:
  mysql57:
    url: "https://docs.oracle.com/cd/E17952_01/mysql-5.7-en/sql-data-definition-statements.html"
    verified: "2026-09-22"
    note: "frozen MySQL 5.7 manual mirror (dev.mysql.com 5.7 URL redirects to 9.7)"
  mysql80:
    url: "https://dev.mysql.com/doc/refman/8.0/en/sql-data-definition-statements.html"
    verified: "2026-09-22"
  mysql84:
    url: "https://dev.mysql.com/doc/refman/8.4/en/sql-data-definition-statements.html"
    verified: "2026-09-22"
  mysql-admin:
    url: "https://dev.mysql.com/doc/refman/8.4/en/resource-groups.html"
    verified: "2026-09-22"
    note: "resource-group statements live under Database Administration in the official manual; in scope per issue #79 T24"
  tidb85:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/sql-statements/sql-statement-overview.md"
    verified: "2026-09-22"
  tidb85-ttl:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/time-to-live.md"
    verified: "2026-09-22"
  tidb85-temp:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/temporary-tables.md"
    verified: "2026-09-22"
  postgresql17:
    url: "https://www.postgresql.org/docs/17/sql-commands.html"
    verified: "2026-11-24"
    note: "PostgreSQL 17 SQL command reference; parser anchored on libpg_query 17 (pg_query_go v6) — PG18-only forms are an explicit out-of-scope boundary"
  mysql57-dml:
    url: "https://docs.oracle.com/cd/E17952_01/mysql-5.7-en/sql-data-manipulation-statements.html"
    verified: "2026-11-15"
    note: "frozen MySQL 5.7 manual mirror DML chapter (dev.mysql.com 5.7 URL redirects to 9.7)"
  mysql80-dml:
    url: "https://dev.mysql.com/doc/refman/8.0/en/sql-data-manipulation-statements.html"
    verified: "2026-11-15"
  mysql84-dml:
    url: "https://dev.mysql.com/doc/refman/8.4/en/sql-data-manipulation-statements.html"
    verified: "2026-11-15"
  tidb85-dml:
    url: "https://raw.githubusercontent.com/pingcap/docs/release-8.5/sql-statements/sql-statement-overview.md"
    verified: "2026-11-15"

statuses:
  semantically_checked: "feature-specific semantic/policy check exists AND cited acceptance evidence exists"
  generic_notice: "parses and only generic findings (e.g. *.notice or unrelated hygiene rules) fire; no feature-specific governance"
  parse_only: "parses into a statement but produces zero findings; silent pass"
  parser_unsupported: "the dialect parser cannot parse a vendor-valid form (parser_error diagnostic)"
  vendor_not_supported: "the database product itself does not support the form (explicit boundary, not a to-do feature)"
  explicit_unsupported: "statement recognized but the product emits explicit unsupported/bounded evidence (not audited, not silent)"
  mixed_coverage: "registered applicable cells contain different audit states (per-subaction split)"
parser_statuses:
  recognized: "parser produces a normalized statement for the form"
  partial: "some documented forms parse, others do not"
  unrecognized: "parser cannot parse the vendor-valid form"
audit_statuses:
  audited: "feature-specific findings/evidence fire for the cell"
  notice_only: "only generic findings fire; no feature-specific governance"
  explicit_unsupported: "explicit unsupported/bounded evidence emitted (parser recognized)"
  silent: "parses with zero findings and no boundary record"
  not_applicable: "cannot audit the cell (e.g. parser unrecognized)"
  mixed: "cells/subactions carry different audit states"
product_scopes:
  registered: "in the product's registered audit domain"
  version_gated: "domain registered on a narrower version slice; this cell is outside it"
  vendor_boundary: "the vendor/engine does not support the form"
  not_applicable: "no product surface applies to this cell"
  unknown: "boundary not yet proven"
official_presences:
  documented: "the official source documents the form for this anchor"
  not_documented: "absent from that version's official list (product boundary recorded, no denominator row)"
  not_assessed: "official presence not yet verified"

