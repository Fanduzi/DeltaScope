# action.yml — DeltaScope GitHub Actions Composite Action
# input: SQL migration files, fail-on severity level, DeltaScope version, optional PR comment token
# output: annotated audit results written to GITHUB_STEP_SUMMARY; non-zero exit on threshold breach
# pos: composite action entrypoint consumed by caller workflows via `uses: Fanduzi/deltascope@v0.13.0`
# note: if this file changes, update docs/examples/github-actions.yml and this header.
name: 'DeltaScope SQL Audit'
description: 'Offline SQL audit for MySQL/TiDB migrations — runs deltascope CLI, annotates the step summary, and optionally comments on pull requests.'
author: 'Fanduzi'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'DeltaScope release tag to download (e.g. v0.13.0). Defaults to latest.'
    required: false
    default: 'latest'
  files:
    description: 'Glob pattern (relative to repo root) of SQL files to audit, e.g. migrations/*.sql.'
    required: false
    default: 'migrations/*.sql'
  fail-on:
    description: 'Minimum severity that causes a non-zero exit: blocker | warning | notice | none'
    required: false
    default: 'blocker'
  config:
    description: 'Path to a deltascope YAML policy config file. Leave blank to use built-in defaults.'
    required: false
    default: ''
  token:
    description: 'GitHub token used to post a PR comment with the audit summary. Set to empty string to disable PR comments.'
    required: false
    default: '${{ github.token }}'

outputs:
  has-issues:
    description: '"true" if any file has findings at or above fail-on threshold, otherwise "false".'
    value: '${{ steps.audit.outputs.has-issues }}'
  result:
    description: 'JSON array of per-file audit results.'
    value: '${{ steps.audit.outputs.result }}'

runs:
  using: 'composite'
  steps:
    # ── 1. Resolve version ────────────────────────────────────────────────────
    - name: Resolve DeltaScope version
      id: resolve-version
      shell: bash
      run: |
        set -euo pipefail
        INPUT_VERSION="${{ inputs.version }}"
        if [[ "${INPUT_VERSION}" == "latest" ]]; then
          RESOLVED=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Fanduzi/DeltaScope/releases/latest \
            | grep -Po '"tag_name":\s*"\K[^"]+' | head -1)
        else
          RESOLVED="${INPUT_VERSION}"
        fi
        echo "Resolved DeltaScope version: ${RESOLVED}"
        echo "version=${RESOLVED}" >> "${GITHUB_OUTPUT}"

    # ── 2. Install deltascope binary ──────────────────────────────────────────
    - name: Install deltascope
      id: install
      shell: bash
      env:
        DS_VERSION: '${{ steps.resolve-version.outputs.version }}'
      run: |
        set -euo pipefail
        OS="linux"
        ARCH=$(uname -m)
        case "${ARCH}" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
          *) echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
        esac

        RAW_VERSION="${DS_VERSION#v}"   # strip leading 'v'
        ARCHIVE="deltascope_${RAW_VERSION}_${OS}_${ARCH}.tar.gz"
        URL="https://github.com/Fanduzi/DeltaScope/releases/download/${DS_VERSION}/${ARCHIVE}"

        echo "Downloading ${URL}"
        curl -fsSL "${URL}" -o /tmp/deltascope.tar.gz
        tar -xzf /tmp/deltascope.tar.gz -C /tmp deltascope
        chmod +x /tmp/deltascope
        echo "/tmp" >> "${GITHUB_PATH}"
        echo "binary=/tmp/deltascope" >> "${GITHUB_OUTPUT}"

    # ── 3. Run audit ──────────────────────────────────────────────────────────
    - name: Run DeltaScope audit
      id: audit
      shell: bash
      env:
        DS_FILES:    '${{ inputs.files }}'
        DS_FAIL_ON:  '${{ inputs.fail-on }}'
        DS_CONFIG:   '${{ inputs.config }}'
      run: |
        set -euo pipefail

        EXTRA_ARGS=()
        if [[ -n "${DS_CONFIG}" ]]; then
          EXTRA_ARGS+=(--config "${DS_CONFIG}")
        fi

        # Expand glob and collect matching files
        shopt -s nullglob
        FILES=(${DS_FILES})
        shopt -u nullglob

        if [[ ${#FILES[@]} -eq 0 ]]; then
          echo "No files matched: ${DS_FILES}"
          echo "has-issues=false" >> "${GITHUB_OUTPUT}"
          echo "result=[]"        >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        OVERALL_EXIT=0
        HAS_ISSUES=false
        ALL_RESULTS="["
        FIRST=1

        for f in "${FILES[@]}"; do
          set +e
          FILE_OUTPUT=$(/tmp/deltascope audit --file "${f}" --fail-on "${DS_FAIL_ON}" --format json "${EXTRA_ARGS[@]}" 2>&1)
          FILE_EXIT=$?
          set -e

          [[ ${FILE_EXIT} -ne 0 ]] && OVERALL_EXIT=1 && HAS_ISSUES=true

          if [[ ${FIRST} -eq 0 ]]; then
            ALL_RESULTS+=","
          fi
          ALL_RESULTS+="{\"file\":\"${f}\",\"exit_code\":${FILE_EXIT},\"output\":$(echo "${FILE_OUTPUT}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo '""')}"
          FIRST=0
        done
        ALL_RESULTS+="]"

        echo "has-issues=${HAS_ISSUES}" >> "${GITHUB_OUTPUT}"
        printf 'result=%s\n' "${ALL_RESULTS}" >> "${GITHUB_OUTPUT}"

        # Write step summary
        {
          if [[ "${HAS_ISSUES}" == "false" ]]; then
            echo "## DeltaScope SQL Audit: Passed"
          else
            echo "## DeltaScope SQL Audit: Failed"
          fi
          echo ""
          for f in "${FILES[@]}"; do
            echo "- \`${f}\`"
          done
        } >> "${GITHUB_STEP_SUMMARY}"

        exit ${OVERALL_EXIT}

    # ── 4. Post PR comment ────────────────────────────────────────────────────
    - name: Post PR comment
      if: github.event_name == 'pull_request' && inputs.token != ''
      shell: bash
      env:
        GH_TOKEN:      '${{ inputs.token }}'
        HAS_ISSUES:    '${{ steps.audit.outputs.has-issues }}'
        REPO:          '${{ github.repository }}'
        PR_NUMBER:     '${{ github.event.pull_request.number }}'
      run: |
        set -euo pipefail
        if [[ "${HAS_ISSUES}" == "false" ]]; then
          STATUS_ICON=":white_check_mark:"
          STATUS_TEXT="Passed"
        else
          STATUS_ICON=":x:"
          STATUS_TEXT="Failed"
        fi

        BODY=$(printf '%s' \
          "## ${STATUS_ICON} DeltaScope SQL Audit — ${STATUS_TEXT}" $'\n\n' \
          "_Triggered by commit \`${{ github.sha }}\`._")

        curl -fsSL \
          -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
          -d "{\"body\": $(echo "${BODY}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}"
