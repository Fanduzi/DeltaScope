rules:
  ddl.table.comment.require:
    enabled: true
    level: warning
    params:
      required: true

  ddl.table.name.max_length:
    enabled: true
    level: blocker
    params:
      limit: 64

  ddl.table.primary_key.require:
    enabled: true
    level: blocker
    params:
      required: true

  ddl.table.primary_key.columns.max_count:
    enabled: true
    level: warning
    params:
      limit: 1

  dml.where.require:
    enabled: true
    level: blocker
    params:
      required: true
