version: 2

project_name: deltascope

builds:
  - id: deltascope
    binary: deltascope
    main: ./cmd/deltascope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: deltascope-server
    binary: deltascope-server
    main: ./cmd/deltascope-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: deltascope-mcp
    binary: deltascope-mcp
    main: ./cmd/deltascope-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - deltascope
      - deltascope-server
      - deltascope-mcp
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .RawVersion }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: "deltascope_{{ .RawVersion }}_checksums.txt"

homebrew_casks:
  - name: deltascope
    ids:
      - deltascope
    repository:
      owner: Fanduzi
      name: homebrew-deltascope
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Fanduzi/DeltaScope"
    description: "Offline SQL review for MySQL and TiDB"
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/deltascope"]
          end

changelog:
  disable: true
