version: 2

project_name: deltascope

builds:
  - id: deltascope
    binary: deltascope
    main: ./cmd/deltascope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: deltascope-server
    binary: deltascope-server
    main: ./cmd/deltascope-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - deltascope
      - deltascope-server
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ trimPrefix `v` .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: "deltascope_{{ trimPrefix `v` .Version }}_checksums.txt"

changelog:
  disable: true
