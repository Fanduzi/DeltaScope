version: 2

# Release matrix note: GoReleaser now publishes a PG-capable main archive for Linux amd64,
# where the CI manylinux/glibc gate can verify CGO output. Darwin and Linux arm64 stay on the
# pure-Go archive path until they have an equivalent PG release baseline. The `deltascope-pg`
# upload remains a transitional compatibility artifact for existing Linux amd64 users.
project_name: deltascope

builds:
  - id: deltascope-pure
    binary: deltascope
    main: ./cmd/deltascope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
  - id: deltascope-server-pure
    binary: deltascope-server
    main: ./cmd/deltascope-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
  - id: deltascope-mcp-pure
    binary: deltascope-mcp
    main: ./cmd/deltascope-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
  - id: deltascope-linux-amd64-pg
    binary: deltascope
    main: ./cmd/deltascope
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=postgresql
    goos:
      - linux
    goarch:
      - amd64
  - id: deltascope-server-linux-amd64-pg
    binary: deltascope-server
    main: ./cmd/deltascope-server
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=postgresql
    goos:
      - linux
    goarch:
      - amd64
  - id: deltascope-mcp-linux-amd64-pg
    binary: deltascope-mcp
    main: ./cmd/deltascope-mcp
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=postgresql
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: default-pure
    ids:
      - deltascope-pure
      - deltascope-server-pure
      - deltascope-mcp-pure
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .RawVersion }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - CHANGELOG.md
      - SECURITY.md
  - id: default-linux-amd64-pg
    ids:
      - deltascope-linux-amd64-pg
      - deltascope-server-linux-amd64-pg
      - deltascope-mcp-linux-amd64-pg
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .RawVersion }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: "deltascope_{{ .RawVersion }}_checksums.txt"

homebrew_casks:
  - name: deltascope
    ids:
      - default-pure
    binaries:
      - deltascope
    repository:
      owner: Fanduzi
      name: homebrew-deltascope
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Fanduzi/DeltaScope"
    description: "Offline SQL review for MySQL and TiDB"
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/deltascope"]
          end

changelog:
  disable: true
