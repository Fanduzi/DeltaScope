version: 2

# Release matrix note: GoReleaser publishes the Linux release assets, including the PG-capable
# main archive for Linux amd64. Darwin main archives are packaged natively in the release
# workflow so they can carry PostgreSQL offline support without pretending Linux CGO can
# cross-build them. The `deltascope-pg` upload remains a transitional compatibility artifact
# for existing Linux amd64 users.
project_name: deltascope

builds:
  - id: deltascope-pure
    binary: deltascope
    main: ./cmd/deltascope
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
  - id: deltascope-server-pure
    binary: deltascope-server
    main: ./cmd/deltascope-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
  - id: deltascope-mcp-pure
    binary: deltascope-mcp
    main: ./cmd/deltascope-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
  - id: deltascope-linux-amd64-pg
    binary: deltascope
    main: ./cmd/deltascope
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=postgresql
    goos:
      - linux
    goarch:
      - amd64
  - id: deltascope-server-linux-amd64-pg
    binary: deltascope-server
    main: ./cmd/deltascope-server
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=postgresql
    goos:
      - linux
    goarch:
      - amd64
  - id: deltascope-mcp-linux-amd64-pg
    binary: deltascope-mcp
    main: ./cmd/deltascope-mcp
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=postgresql
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: default-pure
    ids:
      - deltascope-pure
      - deltascope-server-pure
      - deltascope-mcp-pure
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .RawVersion }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - CHANGELOG.md
      - SECURITY.md
  - id: default-linux-amd64-pg
    ids:
      - deltascope-linux-amd64-pg
      - deltascope-server-linux-amd64-pg
      - deltascope-mcp-linux-amd64-pg
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .RawVersion }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: "deltascope_{{ .RawVersion }}_checksums.txt"

changelog:
  disable: true
