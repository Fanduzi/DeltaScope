name: release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run release test gates
        run: |
          set -euo pipefail
          make release-test-gates

      - name: Verify release-surface gates
        run: make release-surface-gates VERSION="${GITHUB_REF_NAME}"

      - name: Verify release version surfaces
        run: make release-version-surface-gates VERSION="${GITHUB_REF_NAME}"

      - name: Verify release contract gates
        run: make release-contract-gates VERSION="${GITHUB_REF_NAME}"

      - name: Verify converged Linux amd64 PG release archive shape
        run: make verify-pg-linux-release-archive VERSION="${GITHUB_REF_NAME}"

      - name: Resolve release note paths
        run: |
          TAG="${GITHUB_REF_NAME}"
          EN_NOTES_FILE="docs/releases/release-notes-${TAG}.md"
          ZH_NOTES_FILE="docs/releases/release-notes-${TAG}.zh-CN.md"
          COMBINED_NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}-bilingual.md"

          if [ ! -f "$EN_NOTES_FILE" ]; then
            echo "missing English release notes file: $EN_NOTES_FILE" >&2
            exit 1
          fi
          if [ ! -f "$ZH_NOTES_FILE" ]; then
            echo "missing Chinese release notes file: $ZH_NOTES_FILE" >&2
            exit 1
          fi

          cat "$EN_NOTES_FILE" > "$COMBINED_NOTES_FILE"
          printf '\n---\n\n' >> "$COMBINED_NOTES_FILE"
          cat "$ZH_NOTES_FILE" >> "$COMBINED_NOTES_FILE"

          echo "RELEASE_NOTES_FILE=$EN_NOTES_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_ZH_FILE=$ZH_NOTES_FILE" >> "$GITHUB_ENV"
          echo "COMBINED_RELEASE_NOTES_FILE=$COMBINED_NOTES_FILE" >> "$GITHUB_ENV"

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Publish converged release assets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ env.RELEASE_NOTES_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CentOS 7 compatible Linux amd64 main archive
        run: |
          set -euo pipefail
          make package-pg-linux-release-archive-amd64 VERSION="${GITHUB_REF_NAME}"

      - name: Upload CentOS 7 compatible Linux amd64 main archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/deltascope_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz \
            dist/deltascope_${GITHUB_REF_NAME#v}_linux_amd64_checksums.txt \
            dist/deltascope_${GITHUB_REF_NAME#v}_checksums.txt \
            --clobber

      - name: Sync GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file "${COMBINED_RELEASE_NOTES_FILE}"

  release-macos-arm64:
    needs: release-linux
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build native macOS arm64 PG-capable archive
        id: package
        run: |
          set -euo pipefail
          make package-host-release-archive VERSION="${GITHUB_REF_NAME}"
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          CHECKSUM_FILE="dist/deltascope_${VERSION_NO_V}_darwin_arm64_checksums.txt"
          SHA256="$(awk '/  deltascope_'"${VERSION_NO_V}"'_darwin_arm64.tar.gz$/ {print $1}' "$CHECKSUM_FILE")"
          test -n "${SHA256}"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload native macOS arm64 archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/deltascope_${GITHUB_REF_NAME#v}_darwin_arm64.tar.gz \
            dist/deltascope_${GITHUB_REF_NAME#v}_darwin_arm64_checksums.txt \
            --clobber

  release-macos-amd64:
    needs: release-linux
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build native macOS amd64 PG-capable archive
        id: package
        run: |
          set -euo pipefail
          make package-host-release-archive VERSION="${GITHUB_REF_NAME}"
          VERSION_NO_V="${GITHUB_REF_NAME#v}"
          CHECKSUM_FILE="dist/deltascope_${VERSION_NO_V}_darwin_amd64_checksums.txt"
          SHA256="$(awk '/  deltascope_'"${VERSION_NO_V}"'_darwin_amd64.tar.gz$/ {print $1}' "$CHECKSUM_FILE")"
          test -n "${SHA256}"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload native macOS amd64 archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/deltascope_${GITHUB_REF_NAME#v}_darwin_amd64.tar.gz \
            dist/deltascope_${GITHUB_REF_NAME#v}_darwin_amd64_checksums.txt \
            --clobber

  release-linux-arm64:
    needs: release-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build Linux arm64 PG-capable archive
        run: |
          set -euo pipefail
          make package-pg-linux-release-archive-arm64 VERSION="${GITHUB_REF_NAME}"

      - name: Upload Linux arm64 PG-capable archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/deltascope_${GITHUB_REF_NAME#v}_linux_arm64.tar.gz \
            dist/deltascope_${GITHUB_REF_NAME#v}_linux_arm64_checksums.txt \
            --clobber

  publish-homebrew-cask:
    needs:
      - release-linux
      - release-macos-arm64
      - release-macos-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render Homebrew cask
        env:
          VERSION: ${{ github.ref_name }}
          DARWIN_ARM64_SHA256: ${{ needs.release-macos-arm64.outputs.sha256 }}
          DARWIN_AMD64_SHA256: ${{ needs.release-macos-amd64.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/homebrew-deltascope/Casks"
          bash ./scripts/render_homebrew_cask.sh > "${RUNNER_TEMP}/homebrew-deltascope/Casks/deltascope.rb"
          CASK="${RUNNER_TEMP}/homebrew-deltascope/Casks/deltascope.rb" \
            bash ./scripts/verify_homebrew_cask.sh

      - name: Publish Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAP_DIR="${RUNNER_TEMP}/homebrew-deltascope-repo"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Fanduzi/homebrew-deltascope.git" "${TAP_DIR}"
          cp "${RUNNER_TEMP}/homebrew-deltascope/Casks/deltascope.rb" "${TAP_DIR}/Casks/deltascope.rb"
          cd "${TAP_DIR}"
          if git diff --quiet -- Casks/deltascope.rb; then
            echo "Homebrew cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/deltascope.rb
          git commit -m "Update deltascope cask for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  verify-homebrew-cask-install:
    needs:
      - publish-homebrew-cask
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Verify installed Homebrew cask binary contract
        run: |
          set -euo pipefail
          if brew list --cask deltascope >/dev/null 2>&1; then
            brew uninstall --cask deltascope
          fi
          if brew tap | grep -Fxq "fanduzi/deltascope"; then
            brew untap fanduzi/deltascope
          fi
          brew tap fanduzi/deltascope
          brew install --cask deltascope
          version_output="$(deltascope --version)"
          printf '%s\n' "${version_output}"
          case "${version_output}" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "installed deltascope version mismatch: expected ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          case "${version_output}" in
            *postgresql*) ;;
            *) echo "installed deltascope lacks PostgreSQL support: ${version_output}" >&2; exit 1 ;;
          esac
          deltascope audit \
            --dialect postgresql \
            --sql 'create table pg_smoke (id bigint primary key);' \
            --format json \
            --fail-on none >/dev/null

  publish-mcp-launcher-package:
    needs:
      - release-linux
      - release-linux-arm64
      - release-macos-arm64
      - release-macos-amd64
      - verify-homebrew-cask-install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish MCP launcher package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance ./packages/deltascope-mcp
