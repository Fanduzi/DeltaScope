name: release-recover
run-name: Recover release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.230.0"
        required: true
        type: string
      dry_run:
        description: "Exercise recovery without pushing Homebrew or publishing npm"
        required: true
        default: true
        type: boolean
      recover_homebrew:
        description: "Publish or update Homebrew cask"
        required: true
        default: true
        type: boolean
      verify_homebrew:
        description: "Verify Homebrew cask install"
        required: true
        default: true
        type: boolean
      recover_npm:
        description: "Publish npm launcher if absent"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_no_v: ${{ steps.version.outputs.version_no_v }}
      darwin_amd64_sha256: ${{ steps.checksums.outputs.darwin_amd64_sha256 }}
      darwin_arm64_sha256: ${{ steps.checksums.outputs.darwin_arm64_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run release recovery preflight
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}" make release-recovery-preflight

      - name: Derive version without v prefix
        id: version
        run: |
          version_no_v="${{ inputs.version }}"
          version_no_v="${version_no_v#v}"
          echo "version_no_v=${version_no_v}" >> "$GITHUB_OUTPUT"

      - name: Extract Darwin SHA256 checksums from release
        id: checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          TMPDIR="$(mktemp -d)"

          gh release download "${VERSION}" \
            --repo Fanduzi/DeltaScope \
            --pattern "deltascope_${VERSION_NO_V}_darwin_amd64_checksums.txt" \
            --pattern "deltascope_${VERSION_NO_V}_darwin_arm64_checksums.txt" \
            --dir "${TMPDIR}" \
            --clobber

          DARWIN_AMD64_SHA256="$(awk '/  deltascope_'"${VERSION_NO_V}"'_darwin_amd64.tar.gz$/ {print $1}' \
            "${TMPDIR}/deltascope_${VERSION_NO_V}_darwin_amd64_checksums.txt")"
          test -n "${DARWIN_AMD64_SHA256}"

          DARWIN_ARM64_SHA256="$(awk '/  deltascope_'"${VERSION_NO_V}"'_darwin_arm64.tar.gz$/ {print $1}' \
            "${TMPDIR}/deltascope_${VERSION_NO_V}_darwin_arm64_checksums.txt")"
          test -n "${DARWIN_ARM64_SHA256}"

          echo "darwin_amd64_sha256=${DARWIN_AMD64_SHA256}" >> "$GITHUB_OUTPUT"
          echo "darwin_arm64_sha256=${DARWIN_ARM64_SHA256}" >> "$GITHUB_OUTPUT"

  publish-homebrew-cask:
    needs: preflight
    if: ${{ inputs.recover_homebrew }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render Homebrew cask
        env:
          VERSION: ${{ inputs.version }}
          DARWIN_AMD64_SHA256: ${{ needs.preflight.outputs.darwin_amd64_sha256 }}
          DARWIN_ARM64_SHA256: ${{ needs.preflight.outputs.darwin_arm64_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/homebrew-deltascope/Casks"
          bash ./scripts/render_homebrew_cask.sh > "${RUNNER_TEMP}/homebrew-deltascope/Casks/deltascope.rb"
          CASK="${RUNNER_TEMP}/homebrew-deltascope/Casks/deltascope.rb" \
            bash ./scripts/verify_homebrew_cask.sh

      - name: Publish Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAP_DIR="${RUNNER_TEMP}/homebrew-deltascope-repo"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Fanduzi/homebrew-deltascope.git" "${TAP_DIR}"
          cp "${RUNNER_TEMP}/homebrew-deltascope/Casks/deltascope.rb" "${TAP_DIR}/Casks/deltascope.rb"
          cd "${TAP_DIR}"
          if git diff --quiet -- Casks/deltascope.rb; then
            echo "Homebrew cask already up to date"
            exit 0
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Homebrew cask would be updated"
            git diff --stat -- Casks/deltascope.rb
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/deltascope.rb
          git commit -m "Update deltascope cask for ${VERSION}"
          git push origin HEAD:main

  verify-homebrew-cask-install:
    needs: publish-homebrew-cask
    if: ${{ !inputs.dry_run && inputs.verify_homebrew && inputs.recover_homebrew }}
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Verify installed Homebrew cask binary contract
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if brew list --cask deltascope >/dev/null 2>&1; then
            brew uninstall --cask deltascope
          fi
          if brew tap | grep -Fxq "fanduzi/deltascope"; then
            brew untap fanduzi/deltascope
          fi
          brew tap fanduzi/deltascope
          brew install --cask deltascope
          version_output="$(deltascope --version)"
          printf '%s\n' "${version_output}"
          case "${version_output}" in
            *"${VERSION}"*) ;;
            *) echo "installed deltascope version mismatch: expected ${VERSION}" >&2; exit 1 ;;
          esac
          case "${version_output}" in
            *postgresql*) ;;
            *) echo "installed deltascope lacks PostgreSQL support: ${version_output}" >&2; exit 1 ;;
          esac
          deltascope audit \
            --dialect postgresql \
            --sql 'create table pg_smoke (id bigint primary key);' \
            --format json \
            --fail-on none >/dev/null

  publish-mcp-launcher-package:
    needs: preflight
    if: ${{ inputs.recover_npm }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm package state
        id: npm-state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          state_output="$(VERSION="${{ inputs.version }}" bash ./scripts/verify_npm_package_state.sh)"
          echo "${state_output}"
          if echo "${state_output}" | grep -q "^npm-package-state: present "; then
            echo "state=present" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm launcher package
        if: ${{ steps.npm-state.outputs.state == 'absent' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "npm package would be published"
            exit 0
          fi
          npm publish --access public --provenance ./packages/deltascope-mcp
