name: release-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run GoReleaser smoke check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Verify Linux binaries are statically linked
        run: |
          set -euo pipefail

          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/deltascope-linux-amd64 ./cmd/deltascope
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/deltascope-server-linux-amd64 ./cmd/deltascope-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/deltascope-mcp-linux-amd64 ./cmd/deltascope-mcp

          file bin/deltascope-linux-amd64 bin/deltascope-server-linux-amd64 bin/deltascope-mcp-linux-amd64 | tee /tmp/deltascope-file-output.txt
          grep -q "bin/deltascope-linux-amd64:.*statically linked" /tmp/deltascope-file-output.txt
          grep -q "bin/deltascope-server-linux-amd64:.*statically linked" /tmp/deltascope-file-output.txt
          grep -q "bin/deltascope-mcp-linux-amd64:.*statically linked" /tmp/deltascope-file-output.txt
