name: release-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run GoReleaser smoke check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Verify Linux binaries are statically linked
        run: |
          set -euo pipefail

          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/deltascope-linux-amd64 ./cmd/deltascope
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/deltascope-server-linux-amd64 ./cmd/deltascope-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/deltascope-mcp-linux-amd64 ./cmd/deltascope-mcp

          file bin/deltascope-linux-amd64 bin/deltascope-server-linux-amd64 bin/deltascope-mcp-linux-amd64 | tee /tmp/deltascope-file-output.txt
          grep -q "bin/deltascope-linux-amd64:.*statically linked" /tmp/deltascope-file-output.txt
          grep -q "bin/deltascope-server-linux-amd64:.*statically linked" /tmp/deltascope-file-output.txt
          grep -q "bin/deltascope-mcp-linux-amd64:.*statically linked" /tmp/deltascope-file-output.txt

  linux-pg-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify Linux PG CLI smoke lane
        run: make smoke-pg-cli-linux

      - name: Verify tagged PostgreSQL HTTP and MCP surfaces
        run: CGO_ENABLED=1 go test -tags postgresql ./internal/interfaces/http ./internal/interfaces/mcp

  macos-arm64-pg-smoke:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify native macOS arm64 PG-capable main archive shape
        run: make verify-pg-host-release-archive

  macos-amd64-pg-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify native macOS amd64 PG-capable main archive shape
        run: make verify-pg-host-release-archive

  linux-pg-manylinux-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify manylinux glibc baseline for converged Linux amd64 binaries
        run: make smoke-pg-cli-manylinux-baseline

      - name: Verify transitional PG CLI release package shape
        run: |
          set -euo pipefail
          make package-pg-cli-release VERSION=v0.0.0-dev
          test -f dist/deltascope-pg_0.0.0-dev_linux_amd64.tar.gz
          test -f dist/deltascope-pg_0.0.0-dev_linux_amd64_checksums.txt
          tar -tzf dist/deltascope-pg_0.0.0-dev_linux_amd64.tar.gz > /tmp/deltascope-pg-archive-list.txt
          grep -q '^deltascope-pg$' /tmp/deltascope-pg-archive-list.txt

      - name: Verify converged Linux amd64 PG release archive shape
        run: make verify-pg-linux-release-archive

  linux-arm64-pg-manylinux-baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify manylinux glibc baseline for converged Linux arm64 binaries
        run: make smoke-pg-cli-manylinux-baseline-arm64

      - name: Verify converged Linux arm64 PG release archive shape
        run: make verify-pg-linux-release-archive-arm64
